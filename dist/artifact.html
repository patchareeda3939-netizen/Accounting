<title>PSMacc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #EEF3F9;
    --bg-sidebar: #D8E8FA;
    --bg-panel: #FFFFFF;
    --bg-hover: #E5EEF8;
    --bg-accent-soft: #DCEAFA;
    --accent: #2B6CB0;
    --accent-strong: #1B4C82;
    --danger: #B3402A;
    --danger-soft: #FBE7E2;
    --good: #23724F;
    --good-soft: #DDF1E6;
    --warn: #93600F;
    --warn-soft: #FBEFD6;
    --series-rev: #2B6CB0;
    --series-exp: #C97A1E;
    --text-primary: #16233A;
    --text-secondary: #4C5E76;
    --text-muted: #7A8DA6;
    --text-on-accent: #FFFFFF;
    --border: #DCE6F0;
    --border-strong: #C1D3E5;
    --sidebar-text: #16233A;
    --sidebar-text-dim: #5E7794;
    --radius: 10px;
    --ok-strong: #1F6B3A;
    --font-sans: 'IBM Plex Sans Thai', 'Inter', system-ui, sans-serif;
    --font-num: 'Inter', 'IBM Plex Sans Thai', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-page: #0B1626; --bg-sidebar: #060E1B; --bg-panel: #111F33; --bg-hover: #16283F;
      --bg-accent-soft: #1B3350; --accent: #5FA8E0; --accent-strong: #8CC4EC; --danger: #E08469;
      --danger-soft: #3A1E1A; --good: #6CCB9C; --good-soft: #15352A; --warn: #E3B563; --warn-soft: #3A2E15;
      --series-rev: #4A94D0; --series-exp: #BA7E2E;
      --text-primary: #E7F0FA; --text-secondary: #A9C0D8; --text-muted: #7F97B2;
      --text-on-accent: #08131F; --border: #1E3350; --border-strong: #2A4562;
      --sidebar-text: #D9E6F7; --sidebar-text-dim: #6E86A0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-page: #0B1626; --bg-sidebar: #060E1B; --bg-panel: #111F33; --bg-hover: #16283F;
    --bg-accent-soft: #1B3350; --accent: #5FA8E0; --accent-strong: #8CC4EC; --danger: #E08469;
    --danger-soft: #3A1E1A; --good: #6CCB9C; --good-soft: #15352A; --warn: #E3B563; --warn-soft: #3A2E15;
    --series-rev: #4A94D0; --series-exp: #BA7E2E;
    --text-primary: #E7F0FA; --text-secondary: #A9C0D8; --text-muted: #7F97B2;
    --text-on-accent: #08131F; --border: #1E3350; --border-strong: #2A4562;
    --sidebar-text: #D9E6F7; --sidebar-text-dim: #6E86A0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); color: var(--text-primary); font-size: 14px; }
  button, input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: inherit; text-decoration: none; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .app { display: flex; min-height: 100%; }

  .sidebar {
    width: 84px; flex-shrink: 0; background: var(--bg-sidebar);
    border-right: 1px solid var(--border-strong);
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 0 12px; gap: 20px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto; scrollbar-width: none;
  }
  .sidebar::-webkit-scrollbar { display: none; }
  .side-item {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer; color: var(--sidebar-text-dim); width: 100%; padding: 4px 0;
    background: none; border: none;
  }
  .side-item:hover { color: var(--sidebar-text); }
  .side-item.active { color: var(--sidebar-text); font-weight: 600; }
  .side-item span { font-size: 10.5px; text-align: center; line-height: 1.2; }
  .create-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-on-accent); font-size: 22px; font-weight: 400;
  }
  .side-icon { width: 20px; height: 20px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 58px; flex-shrink: 0; display: flex; align-items: center; gap: 14px;
    padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  .company-pill { font-weight: 600; font-size: 15px; white-space: nowrap; max-width: 240px; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary); }
  .search {
    flex: 1; max-width: 480px; display: flex; align-items: center; gap: 8px;
    background: var(--bg-hover); border: 1px solid var(--border); border-radius: 20px;
    padding: 0 14px; color: var(--text-muted);
  }
  .search input { flex: 1; border: none; background: none; padding: 8px 0; font-size: 13.5px; color: var(--text-primary); min-width: 0; }
  .search input:focus { outline: none; }
  .search:focus-within { border-color: var(--accent); }
  .topbar-icons { position: relative; }
  .topbar-icons { display: flex; align-items: center; gap: 14px; margin-left: auto; color: var(--text-secondary); }
  .mode-badge { font-size: 11.5px; padding: 3px 10px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--bg-accent-soft);
    color: var(--accent-strong); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .body-area { flex: 1; padding: 28px 28px 40px; min-width: 0; }

  /* Home */
  .home-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 26px; }
  .home-greeting { font-size: 30px; font-weight: 700; margin: 0; }
  .home-date { font-size: 13.5px; color: var(--text-secondary); margin-top: 4px; }
  .pill-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 28px; }
  .pill {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border-strong); border-radius: 24px; padding: 8px 18px 8px 8px;
    background: var(--bg-panel); cursor: pointer; font-size: 14px; color: var(--text-primary);
  }
  .pill:hover { border-color: var(--accent); }
  .pill-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .quick-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 32px; }
  .quick-row .ql { font-size: 14.5px; font-weight: 600; margin-right: 4px; }
  .chip-btn {
    border: 1px solid var(--border-strong); background: var(--bg-panel); border-radius: 20px;
    padding: 8px 16px; font-size: 13.5px; cursor: pointer; color: var(--text-primary);
  }
  .chip-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .chip-btn.on { background: var(--bg-accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
  .chip-link { font-size: 13.5px; color: var(--accent-strong); font-weight: 500; cursor: pointer; background: none; border: none; }
  .glance-title { font-size: 17px; font-weight: 600; margin: 0 0 14px; }
  .glance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .glance-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .glance-card.clickable { cursor: pointer; }
  .glance-card.clickable:hover { border-color: var(--accent); }
  .glance-label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .glance-value { font-size: 24px; font-weight: 700; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .glance-value.neg { color: var(--danger); }
  .glance-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .recent-section { margin-top: 34px; }

  /* Tables */
  .table-wrap { overflow-x: auto; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .data-table th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table .r { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .data-table tbody tr.row-link { cursor: pointer; }
  .data-table tbody tr.row-link:hover td { background: var(--bg-hover); }
  .data-table tr.group-row td { background: var(--bg-hover); font-weight: 600; font-size: 12.5px; color: var(--text-secondary); }
  .data-table tfoot td { font-weight: 600; border-top: 1px solid var(--border-strong); border-bottom: none; }
  .muted { color: var(--text-muted); }
  .small { font-size: 12px; }
  .empty-hint { font-size: 13px; color: var(--text-muted); padding: 18px 14px; }
  .docno { font-family: var(--font-num); font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }

  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 11px; white-space: nowrap; font-weight: 500; }
  .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-partial { background: var(--bg-accent-soft); color: var(--accent-strong); }
  .st-paid { background: var(--good-soft); color: var(--good); }
  .st-unpaid { background: var(--warn-soft); color: var(--warn); }
  .st-overdue { background: var(--danger-soft); color: var(--danger); }
  .st-done { background: var(--bg-hover); color: var(--text-secondary); }

  /* Section view */
  .section-wrap { display: flex; margin: -28px -28px -40px; min-height: calc(100vh - 58px); }
  .subnav { width: 230px; flex-shrink: 0; background: var(--bg-panel); border-right: 1px solid var(--border); padding: 18px 10px; }
  @media (min-width: 761px) { .subnav { position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto; overscroll-behavior: contain; } }
  .subnav-title { font-size: 12px; color: var(--text-muted); padding: 0 10px 10px; }
  .subnav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border-radius: 8px; background: none; border: none; cursor: pointer;
    font-size: 14px; color: var(--text-primary); margin-bottom: 2px;
  }
  .subnav-item .sn-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; flex-shrink: 0; }
  .subnav-item .sn-chev { margin-left: auto; color: var(--text-muted); font-size: 11px; transition: transform .15s ease; }
  .subnav-item.expanded .sn-chev { transform: rotate(180deg); }
  .subnav-item:hover { background: var(--bg-hover); }
  .subnav-item.active { background: var(--bg-accent-soft); font-weight: 600; }
  .subnav-item.expanded { font-weight: 600; }
  .subnav-children { display: none; flex-direction: column; padding-left: 36px; margin-bottom: 4px; }
  .subnav-children.open { display: flex; }
  .subnav-child {
    width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; background: none; border: 1px solid transparent;
    cursor: pointer; font-size: 13.5px; color: var(--text-secondary); margin-bottom: 1px;
  }
  .subnav-child:hover { background: var(--bg-hover); }
  .subnav-child.active { background: var(--bg-panel); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
  .mobile-nav { display: none; margin-bottom: 16px; }

  .section-content { flex: 1; min-width: 0; padding: 28px 32px 48px; }
  .section-title { font-size: 26px; font-weight: 700; margin: 0 0 6px; text-wrap: balance; }
  .section-sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 22px; max-width: 70ch; line-height: 1.55; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
  .toolbar .field { min-width: 130px; }
  .toolbar .field.grow { flex: 1 1 200px; }
  .page-block { margin-top: 28px; }
  .page-block h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  .page-block .hint { font-size: 12.5px; color: var(--text-muted); margin: -4px 0 10px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .breadcrumb-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-size: 13px; color: var(--text-muted); }
  .empty-state { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; margin-top: 30px; }
  .empty-state-text { flex: 1 1 260px; }
  .empty-state-text h3 { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
  .empty-state-text p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 16px; }
  .empty-state-illo { flex: 1 1 260px; max-width: 340px; }
  .connector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .connector-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .connector-badge { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; }
  .connector-name { font-size: 15px; font-weight: 600; }
  .connector-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; flex: 1; }
  .connector-connect { background: var(--accent-strong); color: var(--bg-panel); border: none; border-radius: 8px; padding: 10px 14px; font-size: 13.5px; cursor: pointer; }
  .section-placeholder { font-size: 14px; color: var(--text-muted); padding: 40px 0; }
  .banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .banner.ok { background: var(--good-soft); color: var(--good); }
  .banner.bad { background: var(--danger-soft); color: var(--danger); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.info { background: var(--bg-accent-soft); color: var(--accent-strong); }

  /* Chart */
  .chart-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 16px 8px; position: relative; }
  .chart-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; flex-wrap: wrap; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-svg text { fill: var(--text-muted); font-size: 11px; font-family: var(--font-num); }
  .chart-svg .grid { stroke: var(--border); stroke-width: 1; }
  .chart-svg .base { stroke: var(--border-strong); stroke-width: 1; }
  .chart-svg .hit { fill: transparent; cursor: default; }
  .chart-svg .hit:hover, .chart-svg .hit.on { fill: var(--bg-hover); opacity: .6; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(10,20,40,.12); display: none; min-width: 150px; z-index: 5; }
  .chart-tip .tt { font-weight: 600; margin-bottom: 4px; }
  .chart-tip .ln { display: flex; justify-content: space-between; gap: 12px; }
  .chart-tip .ln i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  details.table-view { margin-top: 8px; font-size: 13px; }
  details.table-view summary { cursor: pointer; color: var(--accent-strong); padding: 6px 0; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; background: rgba(10, 16, 28, 0.45); display: none; align-items: flex-start; justify-content: center; padding: 70px 16px 20px; z-index: 50; }
  .overlay.open { display: flex; }
  .menu-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.15); padding: 40px 28px 30px; display: grid; grid-template-columns: 1.15fr 1.1fr 1.4fr .65fr 1.1fr; gap: 24px; width: 100%; max-width: 1400px; max-height: 88vh; overflow-y: auto; }
  #menuOverlay { justify-content: flex-start; padding: 64px 16px 16px 96px; }
  @media (max-width: 760px) { #menuOverlay { padding: 64px 12px 12px; } }
  .menu-col-title { font-size: 17px; font-weight: 700; color: var(--text-primary); margin: 0 0 18px; }
  .menu-col button { display: block; width: 100%; text-align: left; font-size: 16px; color: var(--text-primary); padding: 9px 0; background: none; border: none; cursor: pointer; white-space: nowrap; }
  @media (max-width: 900px) { .menu-panel { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); } }
  .menu-col button:hover { color: var(--accent-strong); }
  .modal { background: var(--bg-panel); border-radius: 14px; width: 100%; max-width: 620px; max-height: 86vh; overflow-y: auto; border: 1px solid var(--border); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-panel); z-index: 2; }
  .modal-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .modal-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 18px; line-height: 1; padding: 4px; }
  .modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 5px; }
  .field input, .field select, .items-table input, .items-table select {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--bg-hover); color: var(--text-primary); font-size: 14px;
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .items-wrap { overflow-x: auto; }
  .items-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 420px; }
  .items-table th { text-align: left; font-size: 11.5px; color: var(--text-muted); font-weight: 500; padding: 4px 6px; }
  .items-table td { padding: 4px 6px; }
  .items-table input, .items-table select { padding: 7px 8px; font-size: 13px; }
  .items-table .amt { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text-secondary); }
  .item-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; padding: 4px; }
  .add-row-btn { align-self: flex-start; background: none; border: 1px dashed var(--border-strong); color: var(--accent-strong); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; margin-top: 6px; }
  .sum-block { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
  .sum-line { display: flex; justify-content: space-between; color: var(--text-secondary); }
  .sum-line span:last-child { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .sum-line.big { font-size: 16px; font-weight: 700; color: var(--text-primary); }
  .sum-line.bal-bad { color: var(--danger); }
  .sum-line.bal-ok { color: var(--good); }
  .overlay.full { padding: 0 !important; align-items: stretch; }
  .overlay.full .modal { max-width: none; max-height: none; height: 100vh; border-radius: 0; display: flex; flex-direction: column; }
  .overlay.full .modal-body { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 18px 28px 30px; gap: 18px; }
  .overlay.full .modal-foot { background: #2d2f33; border-top: none; }
  .overlay.full .modal-foot .btn-outline { background: transparent; color: #fff; border-color: #6b6f76; }
  .de-tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .de-tabs span { padding: 6px 2px 10px; color: var(--text-muted); cursor: default; }
  .de-tabs .on { color: var(--text); font-weight: 600; border-bottom: 3px solid #2ca01c; }
  .de-tabs .de-pdf { cursor: pointer; }
  .de-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
  .de-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .de-co { font-size: 13px; line-height: 1.6; color: var(--text-muted); }
  .de-co b { color: var(--text); }
  .de-logo { width: 140px; height: 90px; border: 1px dashed var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 13px; overflow: hidden; }
  .de-logo img { max-width: 100%; max-height: 100%; }
  .de-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; background: rgba(44,160,28,.08); border-radius: 10px; padding: 18px 20px; }

<script>

     authDomain: 'your-project.firebaseapp.com',
     projectId: 'your-project',
     appId: '1:123:web:abc'

var FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDuxqpSzKXZCkDvn255CzZ-dPm_ZhVNtFM',
  authDomain: 'accounting-8288b.firebaseapp.com',

var FIREBASE_STORAGE_ENABLED = false;
/* ================= Firebase: Login + shared database (ใช้เมื่อกำหนด FIREBASE_CONFIG ใน src/config.js) ================= */
var FB = null, FB_MODE = false, CUR_ROLE = null, FB_NEW_CO = null, _fbRoleUnsub = null;
var FB_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';
var ROLE_LABEL = { owner:'เจ้าของ', editor:'ผู้แก้ไข', viewer:'ผู้ดู', removed:'ถูกนำออก', none:'-' };
function fbConfigured() { return typeof FIREBASE_CONFIG !== 'undefined' && !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey); }
function fbReadOnly() { return FB_MODE && CUR_ROLE === 'viewer'; }
// ข้อมูลนิติบุคคลหลัก: แก้ได้เฉพาะเจ้าของ; ข้อมูลใช้งานประจำวัน: เจ้าของและผู้แก้ไข; ผู้ดูอ่านอย่างเดียว (บังคับซ้ำใน firestore.rules)
var LEGAL_FIELDS = ['name', 'legalName', 'taxId', 'businessType', 'legalAddress', 'vatRegistered', 'fiscalStart'];
function canEditLegal() { return !FB_MODE || CUR_ROLE === 'owner'; }
function canEditCompanyInfo() { return !FB_MODE || CUR_ROLE === 'owner' || CUR_ROLE === 'editor'; }
function fbEmail() { return FB && FB.user ? String(FB.user.email || '').toLowerCase() : ''; }

/* ---- Firestore stores nested arrays, undefined and '' keys poorly: encode on write, decode on read ---- */
function fbEncode(v) {
  if (Array.isArray(v)) return v.map(function(x) { x = fbEncode(x); return Array.isArray(x) ? { __arr: x } : x === undefined ? null : x; });
  if (v && typeof v === 'object') { var o = {}; Object.keys(v).forEach(function(k) { var x = fbEncode(v[k]); if (x !== undefined && typeof x !== 'function') o[k === '' ? '_$empty' : k] = x; }); return o; }
  return v;
}
function fbDecode(v) {
  if (Array.isArray(v)) return v.map(function(x) { return x && typeof x === 'object' && !Array.isArray(x) && Array.isArray(x.__arr) && Object.keys(x).length === 1 ? fbDecode(x.__arr) : fbDecode(x); });
  if (v && typeof v === 'object') { var o = {}; Object.keys(v).forEach(function(k) { o[k === '_$empty' ? '' : k] = fbDecode(v[k]); }); return o; }
  return v;
}

/* ---- Adapter with the same shape as the Claude database used by the rest of the app.
   'documents__<co>' → companies/<co>/documents ; 'companies' → only companies this user belongs to ---- */
function fbDb(fs, uid) {
  function colRef(name) {
    if (name === 'companies') return fs.collection('companies');
    var i = name.indexOf('__'), coll = i < 0 ? name : name.slice(0, i), co = i < 0 ? CUR_CO : name.slice(i + 2);
    return fs.collection('companies').doc(co).collection(coll);
  }
  return {
    collection: function(name) {
      var ref = colRef(name), sortF = null, sortDir = 1, lim = 0;
      var api = {
        // sorted in the browser: a Firestore orderBy would silently drop records missing the field
        orderBy: function(f, d) { sortF = f; sortDir = d === 'desc' ? -1 : 1; return api; },
        limit: function(n) { if (name === 'companies') lim = n; return api; },
        onSnapshot: function(cb, err) {
          var q = name === 'companies' ? ref.where('memberIds', 'array-contains', uid) : ref;
          if (lim) q = q.limit(lim);
          return q.onSnapshot(function(qs) {
            var docs = qs.docs.map(function(d) { var data = fbDecode(d.data()); return { id: d.id, data: function() { return data; } }; });
            if (sortF) docs.sort(function(a, b) { var x = a.data()[sortF], y = b.data()[sortF]; return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
            cb({ docs: docs });
          }, err);
        },
        add: function(v) { return ref.add(fbEncode(v)); }
      };
      return api;
    },
    doc: function(path) {
      var i = path.lastIndexOf('/'), name = path.slice(0, i), ref = colRef(name).doc(path.slice(i + 1));
      return {
        // company registry: merge so ownerId/memberIds are never overwritten
        set: function(v) { return name === 'companies' ? ref.set(fbEncode(v), { merge: true }) : ref.set(fbEncode(v)); },
        delete: function() { return ref.delete(); }
      };
    }
  };
}

/* ---- Start-up: load SDK → sign in → accept invites → pick company ---- */
async function fbStart() {
  authShow('loading', 'กำลังเชื่อมต่อ…');
  try {
    await loadScriptOnce(FB_SDK + 'firebase-app-compat.js', function() { return !!window.firebase; });
    await loadScriptOnce(FB_SDK + 'firebase-auth-compat.js', function() { return !!(window.firebase && firebase.auth); });
    await loadScriptOnce(FB_SDK + 'firebase-firestore-compat.js', function() { return !!(window.firebase && firebase.firestore); });
  } catch (e) {
    authShow('error', 'โหลดระบบเข้าสู่ระบบไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า');
    return new Promise(function() {});
  }
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth = firebase.auth(), fs = firebase.firestore();
  if (typeof FIREBASE_EMULATOR_HOST !== 'undefined' && FIREBASE_EMULATOR_HOST) { auth.useEmulator('http://' + FIREBASE_EMULATOR_HOST + ':9099', { disableWarnings: true }); fs.useEmulator(FIREBASE_EMULATOR_HOST, 8080); }
  FB = { auth: auth, fs: fs, user: null };
  var user = await new Promise(function(res) {
    auth.onAuthStateChanged(function(u) {
      if (u && !FB.user) { FB.user = u; res(u); }
      else if (!u && FB.user) location.reload(); // signed out (here or in another tab)
      else if (!u) authShow('login');
    });
  });
  authShow('loading', 'กำลังโหลดบริษัท…');
  var joined = await fbAcceptInvites();
  var cos = await fbMyCompanies();
  while (!cos.length) { await authNoCompany(); cos = await fbMyCompanies(); }
  if (!cos.some(function(c) { return c._id === CUR_CO; })) CUR_CO = cos[0]._id;
  try { localStorage.setItem('psm_company', CUR_CO); } catch (e) {}
  COMPANIES = cos; FB_MODE = true;
  authHide(); fbAvatar(); roWatch(); fbWatchRole();
  if (joined.length) setTimeout(function() { showToast('เข้าร่วมบริษัท ' + joined.join(', ') + ' แล้ว'); }, 600);
  return fbDb(fs, user.uid);
}
// called by initDb once data subscriptions are running
function fbAfterStart() {
  if (!FB_NEW_CO) return;
  var info = FB_NEW_CO; FB_NEW_CO = null;
  saveSettings('company', { name: info.name, legalName: info.name, taxId: info.taxId, branch: 'สำนักงานใหญ่' }).catch(function() {});
  setTimeout(function() { loadStandardCoa(); }, 800);
}
async function fbMyCompanies() {
  var qs = await FB.fs.collection('companies').where('memberIds', 'array-contains', FB.user.uid).get();
  return qs.docs.map(function(d) { var o = Object.assign({}, d.data()); o._id = d.id; return o; }).sort(function(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
}
// every change to companies/{co}/members goes with an audit entry in the same batch (enforced by firestore.rules)
function fbAudit(b, co, action, target, fromRole, toRole, grantedBy) {
  var ref = FB.fs.collection('companies/' + co + '/audit').doc(), a = { action: action, actorUid: FB.user.uid, actorEmail: fbEmail(), targetUid: target.uid, targetEmail: target.email || '', fromRole: fromRole, toRole: toRole, at: firebase.firestore.FieldValue.serverTimestamp() };
  if (grantedBy) a.grantedBy = grantedBy;
  b.set(ref, a);
  return ref.id;
}
async function fbCreateCompany(id, name, taxId) {
  var fs = FB.fs, u = FB.user, b = fs.batch(), me = { uid: u.uid, email: fbEmail() };
  b.set(fs.doc('companies/' + id), { name: name, taxId: taxId || '', createdAt: Date.now(), ownerId: u.uid, memberIds: [u.uid] });
  var aid = fbAudit(b, id, 'create', me, 'none', 'owner');
  b.set(fs.doc('companies/' + id + '/members/' + u.uid), { role: 'owner', email: me.email, addedAt: Date.now(), auditId: aid });
  await b.commit();
}
// invites need a verified email, otherwise anyone could sign up with an invited address
async function fbAcceptInvites() {
  var u = FB.user, names = [];
  if (!u.emailVerified) return names;
  var qs;
  try { qs = await FB.fs.collection('invites').where('email', '==', fbEmail()).get(); } catch (e) { return names; }
  for (var i = 0; i < qs.docs.length; i++) {
    var d = qs.docs[i], inv = d.data(), fs = FB.fs, b = fs.batch(), mref = fs.doc('companies/' + inv.coId + '/members/' + u.uid);
    try {
      var cur = await mref.get(), before = cur.exists ? cur.data().role : 'none';
      if (before !== 'none' && before !== 'removed') throw new Error('already a member');
      var aid = fbAudit(b, inv.coId, 'join', { uid: u.uid, email: fbEmail() }, before, inv.role, inv.invitedByUid);
      b.set(mref, { role: inv.role, email: fbEmail(), addedAt: Date.now(), auditId: aid });
      b.update(fs.doc('companies/' + inv.coId), { memberIds: firebase.firestore.FieldValue.arrayUnion(u.uid) });
      b.delete(d.ref);
      await b.commit(); names.push(inv.coName || inv.coId);
    } catch (e) { try { await d.ref.delete(); } catch (e2) {} } // already a member or invite revoked
  }
  return names;
}
function fbPrimaryOwner() { var c = COMPANIES.find(function(x) { return x._id === CUR_CO; }); return c ? c.ownerId : null; }
function fbWatchRole() {
  if (_fbRoleUnsub) { try { _fbRoleUnsub(); } catch (e) {} }

function saveRecord(btn, coll, rec) {
  var meta = COLL_META[coll];
  var out = {};
  var err = null;
  meta.fields.forEach(function(f) {
    var el = byId('r_' + f.key);
    var v = el.value.trim();
    if (f.required && !v && !err) err = 'กรุณาระบุ' + f.label;
    out[f.key] = f.type === 'number' ? (v === '' ? null : Number(v)) : v;
  });
  if (!err && coll === 'contacts' && out.taxId && !/^\d{13}$/.test(out.taxId.replace(/[\s-]/g, ''))) err = 'เลขประจำตัวผู้เสียภาษีต้องเป็นตัวเลข 13 หลัก';
  if (coll === 'contacts' && out.taxId) out.taxId = out.taxId.replace(/[\s-]/g, '');
  if (coll === 'accounts') out.type = subtypeBase(out.accType);
  if (!err && coll === 'accounts') {

    if (dup) err = 'รหัสบัญชี ' + out.code + ' ถูกใช้แล้วกับ "' + dup.name + '"';
  }

    else await addRec(coll, Object.assign(out, { createdAt: Date.now() }));

    closeModal();
  });

function computeTotals() {
  var def = DOC_TYPES[form.type];
  var base = 0;
  if (def.template === 'itemized') base = form.items.reduce(function(s, r) { return s + (Number(r.qty) || 0) * (Number(r.price) || 0) - (Number(r.discount) || 0); }, 0);
  else if (def.template === 'simple') base = Number((byId('f_amount') || {}).value) || 0;
  var mode = def.vat ? byId('f_vat').value : 'none';
  var whtRate = def.wht ? Number(byId('f_wht').value) || 0 : 0;
  var subtotal = base, vat = 0;
  if (mode === 'exclusive') vat = base * VAT_RATE;
  else if (mode === 'inclusive') { subtotal = base / (1 + VAT_RATE); vat = base - subtotal; }
  subtotal = round2(subtotal); vat = round2(vat);
  var total = round2(subtotal + vat);
  var wht = round2(subtotal * whtRate / 100);
  return { base: round2(base), vatMode: mode, whtRate: whtRate, subtotal: subtotal, vat: vat, total: total, wht: wht, net: round2(total - wht) };
}

function updateSummary() {
  var el = byId('sumBlock');
  if (!el || !form) return;
  var def = DOC_TYPES[form.type];
  if (def.template === 'journal') {
    var dr = round2(form.journal.reduce(function(s, r) { return s + (Number(r.debit) || 0); }, 0));
    var cr = round2(form.journal.reduce(function(s, r) { return s + (Number(r.credit) || 0); }, 0));
    var ok = dr === cr && dr > 0;
    el.innerHTML = '<div class="sum-line"><span>รวมเดบิต</span><span>' + fmtMoney(dr) + '</span></div>' +
      '<div class="sum-line"><span>รวมเครดิต</span><span>' + fmtMoney(cr) + '</span></div>' +
      '<div class="sum-line ' + (ok ? 'bal-ok' : 'bal-bad') + '"><span>' + (ok ? '✓ สมดุล' : 'ยังไม่สมดุล ต่างกัน') + '</span><span>' + (ok ? '' : fmtMoney(Math.abs(dr - cr))) + '</span></div>';
    return;
  }
  var t = computeTotals();
  var h = '';
  if (def.vat && t.vatMode !== 'none') {
    h += '<div class="sum-line"><span>มูลค่าก่อนภาษี</span><span>' + fmtMoney(t.subtotal) + '</span></div>';
    h += '<div class="sum-line"><span>ภาษีมูลค่าเพิ่ม 7%</span><span>' + fmtMoney(t.vat) + '</span></div>';
  }
  h += '<div class="sum-line big"><span>รวมทั้งสิ้น</span><span>' + fmtMoney(t.total) + '</span></div>';
  if (t.wht) {
    h += '<div class="sum-line"><span>หัก ณ ที่จ่าย ' + t.whtRate + '% (จากมูลค่าก่อน VAT)</span><span>−' + fmtMoney(t.wht) + '</span></div>';
    h += '<div class="sum-line big"><span>' + (def.group === 'customer' ? 'ยอดรับสุทธิ' : 'ยอดจ่ายสุทธิ') + '</span><span>' + fmtMoney(t.net) + '</span></div>';
  }
  el.innerHTML = h;
}

function accBaseOf(code) {
  var a = STORE.accounts.find(function(x) { return x.code === code; });
  return a ? subtypeBase(accSubtype(a)) : ({ '1':'asset','2':'liability','3':'equity','4':'income','5':'expense' })[String(code).charAt(0)] || 'expense';
}
// P&L from the ledger: every posting to an income / expense account counts
function plTotals(docs) {
  var rev = 0, exp = 0;
  docs.forEach(function(d) { if (isYearClose(d)) return; postingsOf(d).forEach(function(l) { var b = accBaseOf(l.code); if (b === 'income') rev += l.cr - l.dr; else if (b === 'expense') exp += l.dr - l.cr; }); });
  return { rev: round2(rev), exp: round2(exp), profit: round2(rev - exp) };
}
function openItems(type) {
  return STORE.documents.filter(function(d) { return d.type === type && docStatus(d) !== 'paid'; });
}
function sumNet(list) { return round2(list.reduce(function(s, d) { return s + docBal(d); }, 0)); }

function periodRange(p) {
  if (p === 'custom') return [pageState.pFrom || '0000-01-01', pageState.pTo || '9999-12-31'];
  var t = todayStr(), y = t.slice(0,4), m = Number(t.slice(5,7));
  if (p === 'month') return [t.slice(0,7) + '-01', t];
  if (p === 'quarter') { var qm = Math.floor((m - 1) / 3) * 3 + 1; return [y + '-' + String(qm).padStart(2,'0') + '-01', t]; }
  if (p === 'year') return [y + '-01-01', t];
  if (p === 'last12') { var d = new Date(t + 'T00:00:00'); d.setMonth(d.getMonth() - 11); d.setDate(1); return [d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-01', t]; }
  return ['0000-01-01', '9999-12-31'];
}

document.addEventListener('change', function(e) {

    pageState[t.classList.contains('pr-from') ? 'pFrom' : 'pTo'] = t.value;
    document.querySelectorAll(t.classList.contains('pr-from') ? '.pr-from' : '.pr-to').forEach(function(x) { x.value = t.value; });

    if (box) { box.hidden = t.value !== 'custom'; box.querySelector('.pr-from').value = pageState.pFrom || ''; box.querySelector('.pr-to').value = pageState.pTo || ''; }

}, true);

function last12Months() {
  var out = [], d = new Date(todayStr() + 'T00:00:00');
  d.setDate(1);
  for (var i = 11; i >= 0; i--) {
    var x = new Date(d); x.setMonth(d.getMonth() - i);
    out.push(x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0'));
  }
  return out;
}

function agingBuckets(list) {
  var b = [{ label:'ยังไม่ครบกำหนด', n:0, amt:0 }, { label:'1–30 วัน', n:0, amt:0 }, { label:'31–60 วัน', n:0, amt:0 }, { label:'61–90 วัน', n:0, amt:0 }, { label:'เกิน 90 วัน', n:0, amt:0 }];
  var t = todayStr();
  list.forEach(function(d) {
    var due = (d.extra && d.extra.dueDate) || d.date;
    var late = daysBetween(due, t);
    var i = late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : 4;
    b[i].n++; b[i].amt += docBal(d);
  });
  return b;
}

function accountBalances() {
  var bal = {};
  allLines().forEach(function(l) { var b = bal[l.code] = bal[l.code] || { dr:0, cr:0 }; b.dr += l.dr; b.cr += l.cr; });
  return bal;
}

function productStock(p) {
  var q = Number(p.openingQty) || 0;
  STORE.documents.forEach(function(d) {
    if (d.type === 'inventoryAdjust' && !d.voided) q += adjQty(d, p.name);
    if ((d.type === 'invoice' || d.type === 'bill') && d.items) {
      d.items.forEach(function(r) { if (r.name === p.name) q += (d.type === 'bill' ? 1 : -1) * (Number(r.qty) || 0); });
    }
  });
  return q;
}

  var btn = byId('loadStdCoa') || { };
  var have = {};
  STORE.accounts.forEach(function(a) { have[a.code] = 1; });
  var todo = STANDARD_COA.filter(function(r) { return !have[r[0]]; });
  if (!todo.length) { showToast('มีผังบัญชีมาตรฐานครบแล้ว'); return; }
  btn.disabled = true; showToast('กำลังเพิ่ม ' + todo.length + ' บัญชี…');

    for (var i = 0; i < todo.length; i++) await addRec('accounts', { code: todo[i][0], name: todo[i][1], type: subtypeBase(todo[i][2]), accType: todo[i][2], detailType: todo[i][3], taxCode: todo[i][4], createdAt: Date.now() });

  renderPage();
}

var LOCAL_SAVER = { save: async function(o) { saveFileLocally(o.filename, o.data, FILE_MIME[String(o.filename).split('.').pop().toLowerCase()] || 'application/octet-stream'); } };
async function getSaver() { return (await getDownloads()) || LOCAL_SAVER; }
function coaExportRows(scope) {
  var list = scope === 'filtered' ? coaList() : scope === 'selected' ? STORE.accounts.filter(function(a) { return coaSelected[a._id]; }) : STORE.accounts.slice().sort(function(a, b) { return String(a.code).localeCompare(String(b.code)); });
  var bal = accountBalances();
  return [['รหัส','ชื่อบัญชี','ประเภทบัญชี','งบ','ประเภทรายละเอียด','ภาษี','ยอดคงเหลือ']].concat(list.map(function(a) {
    var st = accSubtype(a), base = subtypeBase(st), b = bal[a.code] || { dr:0, cr:0 };
    var v = (base === 'asset' || base === 'expense') ? b.dr - b.cr : b.cr - b.dr;
    var tax = (TAX_CODES.find(function(t) { return t[0] === (a.taxCode || ''); }) || ['',''])[1].replace('—','');
    return [a.code, a.name, subtypeLabel(st), isPL(a) ? 'P&L' : 'BAL', a.detailType || '', tax, isPL(a) ? '' : round2(v)];
  }));
}
function toCsv(rows) { return '﻿' + rows.map(function(r) { return r.map(function(c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n'); }
async function openCoaExport() {
  var d = byId('coaDrop'); if (d) d.hidden = true;
  if (!STORE.accounts.length) { showToast('ยังไม่มีบัญชีให้ส่งออก'); return; }
  var nSel = STORE.accounts.filter(function(a) { return coaSelected[a._id]; }).length;
  var nFil = coaList().length;
  var dl = await getSaver();
  var body = '<div class="field"><label for="expScope">บัญชีที่จะส่งออก</label><select id="expScope"><option value="all">ทั้งหมด (' + STORE.accounts.length + ' บัญชี)</option>' +
    (nFil !== STORE.accounts.length ? '<option value="filtered">ตามตัวกรองปัจจุบัน (' + nFil + ' บัญชี)</option>' : '') +
    (nSel ? '<option value="selected">เฉพาะที่เลือก (' + nSel + ' บัญชี)</option>' : '') + '</select></div>' +
    '<div class="field"><label for="expFmt">รูปแบบไฟล์</label><select id="expFmt"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV (UTF-8)</option></select></div>' +
    '<p class="small muted" style="margin:0">ไฟล์ที่ได้ใช้รูปแบบเดียวกับเมนูนำเข้า จึงนำกลับเข้ามาได้ทันที</p>' +
    '<div class="form-error" id="formError" hidden></div>';
  openModal({ title:'ส่งออกผังบัญชี', body: body, focus:false, buttons: [CANCEL_BTN, { label:'ส่งออก', cls:'btn-dark', onClick: function(btn) { doCoaExport(btn, dl); } }] });
}
async function doCoaExport(btn, dl) {
  var rows = coaExportRows(byId('expScope').value);
  var fmt = byId('expFmt').value;
  var name = 'ผังบัญชี-' + companyName().replace(/[\\/:*?"<>|]/g, '_') + '-' + todayStr();
  btn.disabled = true;
  try {
    var data, filename;
    if (fmt === 'xlsx') {
      await loadXlsxLib();
      var ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{ wch:8 }, { wch:30 }, { wch:22 }, { wch:6 }, { wch:34 }, { wch:10 }, { wch:14 }];
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'ผังบัญชี');
      data = new Uint8Array(XLSX.write(wb, { bookType:'xlsx', type:'array' }));
      filename = name + '.xlsx';
    } else { data = toCsv(rows); filename = name + '.csv'; }
    await dl.save({ filename: filename, data: data });
    showToast('ส่งออก ' + (rows.length - 1) + ' บัญชีแล้ว');
    closeModal();
  } catch (e) {
    btn.disabled = false;
    if (e && e.code === 'declined') return;
    var el = byId('formError');
    el.textContent = e && e.code === 'rejected_extension' ? 'ระบบไม่อนุญาตไฟล์ชนิดนี้ ลองเลือกรูปแบบ CSV' : 'ส่งออกไม่สำเร็จ ลองอีกครั้ง';
    el.hidden = false;
  }
}

function openAccountHistory(id) {
  var a = STORE.accounts.find(function(x) { return x._id === id; });
  if (!a) return;
  var base = subtypeBase(accSubtype(a)), debitNormal = base === 'asset' || base === 'expense';
  var lines = allLines().filter(function(l) { return l.code === a.code; }).map(function(l) { return { d: l.d, dr: l.dr, cr: l.cr, date: l.date, memo: l.memo }; });
  lines.sort(function(x, y) { return (x.date || '').localeCompare(y.date || ''); });
  var run = 0;
  var rows = lines.map(function(l) {
    run += debitNormal ? l.dr - l.cr : l.cr - l.dr;
    return '<tr class="row-link" data-docm="' + esc(l.d._id) + '"><td style="white-space:nowrap">' + fmtDate(l.date) + '</td><td class="docno">' + esc(l.d.docNo) + '</td><td>' + esc(l.d.typeLabel + ' · ' + l.d.party) + (l.memo ? ' <span class="small muted">' + esc(l.memo) + '</span>' : '') + '</td><td class="r">' + (l.dr ? fmtMoney(l.dr) : '') + '</td><td class="r">' + (l.cr ? fmtMoney(l.cr) : '') + '</td><td class="r">' + fmtMoney(run) + '</td></tr>';
  }).join('');
  openModal({ title: 'ประวัติบัญชี ' + a.code + ' ' + a.name, focus:false,
    body: '<div class="items-wrap"><table class="data-table"><thead><tr><th>วันที่</th><th>เลขที่</th><th>คำอธิบาย</th><th class="r">เดบิต</th><th class="r">เครดิต</th><th class="r">คงเหลือ</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="6" class="empty-hint">ยังไม่มีรายการในบัญชีนี้</td></tr>') + '</tbody></table></div>',
    buttons: [{ label:'แก้ไขบัญชี', onClick: function() { openRecordForm('accounts', a); } }, { label:'ปิด', cls:'btn-primary', onClick: closeModal }] });
}

function productsData() {
  if (pageState.invTab === 'adj') return adjTabData();
  var q = (pageState.productQ || '').toLowerCase();
  var list = STORE.products.filter(function(p) {
    if (q && [p.name, p.sku, p.category].join(' ').toLowerCase().indexOf(q) < 0) return false;
    if (pageState.invKind && (p.kind || 'goods') !== pageState.invKind) return false;
    if (pageState.invStock && invStockState(p) !== pageState.invStock) return false;
    return true;
  });
  var img = '<span class="iv-img"><svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="24" height="20" rx="1"/><circle cx="8" cy="7" r="2.5"/><path d="M1 18l7-7 5 5 4-3 8 6"/></svg></span>';
  var rows = list.map(function(p) {
    var goods = isStocked(p), ss = invStockState(p);

  var line = function(no, label, amt, strong) { return '<tr' + (strong ? ' style="font-weight:700"' : '') + '><td class="num muted">' + no + '</td><td>' + label + '</td><td class="r">' + fmtMoney(amt) + '</td></tr>'; };
  var sales = vatDocs().filter(function(d) { return (d.date || '').slice(0,7) === ym && docFlow(d) === 'rev'; });
  var base = round2(sales.reduce(function(s, d) { return s + docAmountExVat(d) * docSign(d); }, 0));
  var zero = round2(sales.filter(function(d) { return !d.vat; }).reduce(function(s, d) { return s + docAmountExVat(d) * docSign(d); }, 0));
  var purch = round2(vatDocs().filter(function(d) { return (d.date || '').slice(0,7) === ym && docFlow(d) === 'exp' && d.vat; }).reduce(function(s, d) { return s + docAmountExVat(d) * docSign(d); }, 0));
  var body = '<p class="small muted" style="margin:0">สรุปตามแบบ ภ.พ.30 งวด ' + monthLabel(ym, true) + ' ใช้กรอกในระบบยื่นแบบของกรมสรรพากร</p>' +
    '<div class="items-wrap"><table class="data-table"><tbody>' +
    line('1', 'ยอดขายในเดือนนี้', base) + line('2', 'หัก ยอดขายที่ไม่ต้องเสียภาษี / ไม่มี VAT', zero) + line('4', 'ยอดขายที่ต้องเสียภาษี', round2(base - zero)) +
    line('5', 'ภาษีขายเดือนนี้', v.out) + line('6', 'ยอดซื้อที่มีสิทธินำภาษีซื้อมาหัก', purch) + line('7', 'ภาษีซื้อเดือนนี้', v.inp) +
    (v.adj ? line('', 'การปรับปรุง', v.adj) : '') +
    line(v.due >= 0 ? '8' : '9', v.due >= 0 ? 'ภาษีที่ต้องชำระเดือนนี้' : 'ภาษีที่ชำระเกินเดือนนี้', Math.abs(v.due), true) +
    '</tbody></table></div>' +
    (filed ? '<div class="banner ok">ยื่นแล้วเมื่อ ' + fmtDate(v.ret.filedDate) + '</div>' : '<div class="field"><label for="fileDate">วันที่ยื่นแบบ</label><input id="fileDate" type="date" value="' + todayStr() + '"></div>');
  var buttons = [];
  if (filed) buttons.push({ label:'ยกเลิกสถานะยื่นแล้ว', cls:'btn-danger', left:true, onClick: function(b) { runSave(b, async function() { await saveReturn(ym, { filedDate: null }); showToast('ยกเลิกสถานะยื่นแล้ว'); closeModal(); }); } });
  buttons.push({ label:'ปิด', onClick: closeModal });
  if (!filed) buttons.push({ label:'ทำเครื่องหมายว่ายื่นแล้ว', cls:'btn-dark', onClick: function(b) {
    var fd = byId('fileDate').value || todayStr();
    runSave(b, async function() { await saveReturn(ym, { filedDate: fd, filedAmount: v.due }); showToast('บันทึกการยื่น ภ.พ.30 งวด ' + monthLabel(ym, true) + ' แล้ว'); closeModal(); });
  } });
  else if (v.bal > 0) buttons.push({ label:'บันทึกการชำระเงิน', cls:'btn-dark', onClick: function() { openTaxPayment(ym); } });
  openModal({ title:'แบบแสดงรายการภาษี ' + monthLabel(ym, true), body: body, buttons: buttons, focus:false });
}

function nextMonthDay(ym, day) {
  var d = new Date(ym + '-01T00:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(day);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
}
function taxData() {
  var ym = pageState.taxMonth || todayStr().slice(0,7);
  var inMonth = taxDocs().filter(function(d) { return (d.date || '').slice(0,7) === ym; });
  var outDocs = inMonth.filter(function(d) { return docFlow(d) === 'rev' && d.vat; });
  var inDocs = vatDocs().filter(function(d) { return (d.date || '').slice(0,7) === ym && docFlow(d) === 'exp' && d.vat; });
  var outVat = round2(outDocs.reduce(function(s, d) { return s + d.vat * docSign(d); }, 0));
  var inVat = round2(inDocs.reduce(function(s, d) { return s + d.vat * docSign(d); }, 0));
  var pay = round2(outVat - inVat);
  var h = '<p class="hint" style="margin-top:0">เดือนภาษี ' + monthLabel(ym, true) + '</p><div class="kpi-row">' +
    kpi('ภาษีขาย', fmtMoney(outVat), outDocs.length + ' เอกสาร') +
    kpi('ภาษีซื้อ', fmtMoney(inVat), inDocs.length + ' เอกสาร') +
    kpi(pay >= 0 ? 'ภาษีที่ต้องชำระ' : 'ภาษีชำระเกิน (ขอคืน/ยกไป)', fmtMoney(Math.abs(pay)), 'ยื่น ภ.พ.30 ภายใน ' + fmtDate(nextMonthDay(ym, 15)) + ' (ออนไลน์ ' + fmtDate(nextMonthDay(ym, 23)) + ')', pay > 0 ? '' : '') + '</div>';

  function vatTable(list, empty) {
    return tableOrEmpty('<th>วันที่</th><th>เลขที่</th><th>คู่ค้า</th><th>เลขผู้เสียภาษี</th><th class="r">มูลค่า</th><th class="r">VAT</th>',
      list.map(function(d) {
        var c = STORE.contacts.find(function(c) { return c._id === d.contactId || c.name === d.party; });
        var s = docSign(d);
        return '<tr class="row-link" tabindex="0" data-doc="' + esc(d._id) + '"><td style="white-space:nowrap">' + fmtDate(d._docDate || d.date) + '</td><td class="docno">' + esc((d.extra && d.extra.supInvNo) || d.docNo) + ((d.extra && d.extra.supInvNo) ? '<div class="small muted">' + esc(d.docNo) + '</div>' : '') + '</td><td>' + esc(d.party) + (s < 0 ? ' <span class="small muted">(' + esc(d.typeLabel) + ')</span>' : '') + '</td><td class="num small">' + esc(c && c.taxId || '-') + '</td><td class="r">' + fmtMoney(d.subtotal * s) + '</td><td class="r">' + fmtMoney(d.vat * s) + '</td></tr>';
      }).join(''), empty);
  }
  h += '<div class="page-block"><h2>รายงานภาษีขาย</h2>' + vatTable(outDocs, 'ไม่มีเอกสารขายที่มี VAT ในเดือนนี้') + '</div>';
  h += '<div class="page-block"><h2>รายงานภาษีซื้อ</h2>' + vatTable(inDocs, 'ไม่มีเอกสารซื้อที่มี VAT ในเดือนนี้') + '</div>';

  var whtPaid = inMonth.filter(function(d) { return d.group === 'supplier' && d.wht; });
  var whtRecv = inMonth.filter(function(d) { return d.group === 'customer' && d.wht; });
  function entityOf(d) { var c = STORE.contacts.find(function(c) { return c._id === d.contactId || c.name === d.party; }); return c && c.entity === 'person' ? 'person' : 'company'; }
  var p3 = whtPaid.filter(function(d) { return entityOf(d) === 'person'; }), p53 = whtPaid.filter(function(d) { return entityOf(d) === 'company'; });
  function whtRows(list) {
    return list.map(function(d) { return '<tr class="row-link" tabindex="0" data-doc="' + esc(d._id) + '"><td style="white-space:nowrap">' + fmtDate(d.date) + '</td><td class="docno">' + esc(d.docNo) + '</td><td>' + esc(d.party) + '</td><td class="r">' + fmtMoney(d.subtotal) + '</td><td class="r">' + esc(d.whtRate) + '%</td><td class="r">' + fmtMoney(d.wht) + '</td></tr>'; }).join('');
  }
  var whHead = '<th>วันที่</th><th>เลขที่</th><th>ผู้รับเงิน</th><th class="r">เงินได้</th><th class="r">อัตรา</th><th class="r">ภาษีที่หัก</th>';
  h += '<div class="page-block"><h2>ภาษีหัก ณ ที่จ่ายที่ต้องนำส่ง</h2><p class="hint">นำส่งภายใน ' + fmtDate(nextMonthDay(ym, 7)) + ' (ออนไลน์ ' + fmtDate(nextMonthDay(ym, 15)) + ') แยกตามสถานะผู้รับเงินในข้อมูลผู้ติดต่อ</p>' +
    '<div class="kpi-row">' + kpi('ภ.ง.ด.3 (บุคคลธรรมดา)', fmtMoney(sumBy(p3, 'wht')), p3.length + ' รายการ') + kpi('ภ.ง.ด.53 (นิติบุคคล)', fmtMoney(sumBy(p53, 'wht')), p53.length + ' รายการ') + kpi('ถูกลูกค้าหัก ณ ที่จ่าย', fmtMoney(sumBy(whtRecv, 'wht')), 'ใช้เครดิตภาษีตอนยื่น ภ.ง.ด.50') + '</div>' +
    '<div style="height:12px"></div>' + tableOrEmpty(whHead, whtRows(whtPaid), 'ไม่มีรายการหัก ณ ที่จ่ายในเดือนนี้') + '</div>';
  return h;
}
function sumBy(list, f) { return round2(list.reduce(function(s, d) { return s + (Number(d[f]) || 0); }, 0)); }

}
function reportsData() {
  var r = periodRange(pageState.reportPeriod);
  var docs = STORE.documents.filter(function(d) { return inRange(d.date || '', r); });
  var pl = plTotals(docs);
  var margin = pl.rev ? Math.round(pl.profit / pl.rev * 1000) / 10 : null;
  var h = '<div class="kpi-row">' + kpi('รายได้', fmtMoney(pl.rev, 0)) + kpi('ค่าใช้จ่าย', fmtMoney(pl.exp, 0)) +
    kpi('กำไรสุทธิ', fmtMoney(pl.profit, 0), margin == null ? '' : 'อัตรากำไร ' + margin + '%', pl.profit < 0 ? 'neg' : '') + '</div>';

  // monthly chart
  var months = last12Months();
  var series = months.map(function(m) {
    return plTotals(STORE.documents.filter(function(d) { return (d.date || '').slice(0,7) === m; }));
  });
  h += '<div class="page-block"><h2>รายได้และค่าใช้จ่ายรายเดือน</h2><p class="hint">12 เดือนล่าสุด ไม่ขึ้นกับช่วงเวลาที่เลือก</p>' + barChart(months, series) + '</div>';

  // P&L
  var revBy = {}, expBy = {};
  docs.forEach(function(d) {
    var f = docFlow(d); if (!f) return;
    var amt = docAmountExVat(d) * docSign(d);
    if (f === 'rev') { var rk = (d.extra && d.extra.incomeCat) || d.typeLabel; revBy[rk] = (revBy[rk] || 0) + amt; }
    else { var k = (d.extra && d.extra.expCategory) || 'ไม่ระบุหมวด'; expBy[k] = (expBy[k] || 0) + amt; }
  });
  function lines(obj) { return Object.keys(obj).sort(function(a, b) { return obj[b] - obj[a]; }).map(function(k) { return '<tr><td style="padding-left:28px">' + esc(k) + '</td><td class="r">' + fmtMoney(obj[k]) + '</td></tr>'; }).join(''); }
  h += '<div class="page-block"><h2>งบกำไรขาดทุน</h2><p class="hint">' + fmtDate(r[0] === '0000-01-01' ? '' : r[0]) + ' – ' + fmtDate(r[1] === '9999-12-31' ? todayStr() : r[1]) + '</p>' +
    '<div class="table-wrap"><table class="data-table"><tbody>' +
    '<tr class="group-row"><td>รายได้</td><td class="r">' + fmtMoney(pl.rev) + '</td></tr>' + (lines(revBy) || '<tr><td class="muted" colspan="2" style="padding-left:28px">ไม่มีรายการ</td></tr>') +
    '<tr class="group-row"><td>ค่าใช้จ่าย</td><td class="r">' + fmtMoney(pl.exp) + '</td></tr>' + (lines(expBy) || '<tr><td class="muted" colspan="2" style="padding-left:28px">ไม่มีรายการ</td></tr>') +
    '</tbody><tfoot><tr><td>กำไร (ขาดทุน) สุทธิ</td><td class="r"' + (pl.profit < 0 ? ' style="color:var(--danger)"' : '') + '>' + fmtMoney(pl.profit) + '</td></tr></tfoot></table></div></div>';

  // Aging
  function agingTable(list) {
    var b = agingBuckets(list), tot = 0, n = 0;
    return tableOrEmpty('<th>อายุหนี้</th><th class="r">จำนวน</th><th class="r">ยอดคงค้าง</th>', b.map(function(x) { tot += x.amt; n += x.n; return '<tr><td>' + x.label + '</td><td class="r">' + x.n + '</td><td class="r">' + fmtMoney(x.amt) + '</td></tr>'; }).join(''), '',
      '<tr><td>รวม</td><td class="r">' + n + '</td><td class="r">' + fmtMoney(tot) + '</td></tr>');
  }
  h += '<div class="page-block two-col"><div><h2>ลูกหนี้ค้างรับตามอายุหนี้</h2>' + agingTable(openItems('invoice')) + '</div><div><h2>เจ้าหนี้ค้างจ่ายตามอายุหนี้</h2>' + agingTable(openItems('bill')) + '</div></div>';

  // Top customers
  var byCust = {};
  docs.forEach(function(d) { if (docFlow(d) === 'rev') byCust[d.party] = (byCust[d.party] || 0) + docAmountExVat(d) * docSign(d); });
  var top = Object.keys(byCust).sort(function(a, b) { return byCust[b] - byCust[a]; }).slice(0, 5);
  h += '<div class="page-block"><h2>ลูกค้าที่มียอดขายสูงสุด</h2>' + tableOrEmpty('<th>ลูกค้า</th><th class="r">ยอดขาย</th><th class="r">สัดส่วน</th>',
    top.map(function(k) { return '<tr><td>' + esc(k) + '</td><td class="r">' + fmtMoney(byCust[k]) + '</td><td class="r">' + (pl.rev ? Math.round(byCust[k] / pl.rev * 100) : 0) + '%</td></tr>'; }).join(''), 'ยังไม่มียอดขายในช่วงนี้') + '</div>';
  return h;
}

function niceMax(v) {
  if (v <= 0) return 1000;
  var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function shortMoney(v) {
  if (v >= 1e6) return (v / 1e6).toLocaleString('th-TH', { maximumFractionDigits:1 }) + 'M';
  if (v >= 1e3) return (v / 1e3).toLocaleString('th-TH', { maximumFractionDigits:1 }) + 'K';
  return String(Math.round(v));
}
var CHART_DATA = null;
function barChart(months, series) {
  CHART_DATA = { months: months, series: series };
  var W = 720, H = 250, L = 48, R = 8, T = 12, B = 30;
  var max = niceMax(Math.max.apply(null, series.map(function(s) { return Math.max(s.rev, s.exp, 0); })));
  var pw = W - L - R, ph = H - T - B, slot = pw / months.length, bw = Math.min(16, (slot - 12) / 2);
  var y = function(v) { return T + ph - (Math.max(v, 0) / max) * ph; };
  var svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="กราฟรายได้และค่าใช้จ่ายรายเดือน">';
  for (var i = 0; i <= 4; i++) {
    var v = max * i / 4, yy = y(v);
    svg += '<line class="' + (i ? 'grid' : 'base') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/>';
    svg += '<text x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + shortMoney(v) + '</text>';
  }
  function bar(x, v, color) {
    if (v <= 0) return '';
    var top = y(v), base = y(0), hgt = base - top, r = Math.min(4, hgt, bw / 2);
    return '<path fill="' + color + '" d="M' + x + ',' + base + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + base + 'Z"/>';
  }
  months.forEach(function(m, i) {
    var cx = L + slot * i + slot / 2;
    svg += '<rect class="hit" data-i="' + i + '" x="' + (L + slot * i + 1) + '" y="' + T + '" width="' + (slot - 2) + '" height="' + ph + '" rx="4"/>';
    svg += bar(cx - bw - 1, series[i].rev, 'var(--series-rev)');
    svg += bar(cx + 1, series[i].exp, 'var(--series-exp)');
    svg += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + monthLabel(m) + '</text>';
  });
  svg += '</svg>';
  var table = '<details class="table-view"><summary>ดูเป็นตาราง</summary><div class="items-wrap"><table class="data-table"><thead><tr><th>เดือน</th><th class="r">รายได้</th><th class="r">ค่าใช้จ่าย</th><th class="r">กำไร</th></tr></thead><tbody>' +
    months.map(function(m, i) { return '<tr><td>' + monthLabel(m, true) + '</td><td class="r">' + fmtMoney(series[i].rev) + '</td><td class="r">' + fmtMoney(series[i].exp) + '</td><td class="r">' + fmtMoney(series[i].profit) + '</td></tr>'; }).join('') +

    }

    Object.keys(byDate).forEach(function(dt) { var a = round2(byDate[dt]); if (a) out.push({ date: dt, amt: a, cat: label, d: d }); });

}

function impVal(r, key) { var i = impState.map[key]; return i == null ? '' : String(r[i] == null ? '' : r[i]).trim(); }

    if (y < 100) y += y >= 50 ? 2500 : 2000;
    if (y > 2400) y -= 543;

// build records to import; each {ok, err, label, rec}
function buildImport() {
  var k = impState.kind, meta = IMP_KINDS.find(function(x) { return x.key === k; }), out = [];
  if (k === 'customers' || k === 'vendors' || k === 'products') {
    var coll = k === 'products' ? 'products' : 'contacts', names = {};
    STORE[coll].forEach(function(c) { names[String(c.name).toLowerCase()] = 1; });
    impState.rows.forEach(function(r) {
      var rec = {}; IMP_FIELDS[k].forEach(function(f) { var v = impVal(r, f.key); if (v !== '') rec[f.key] = v; });
      var err = !rec.name ? 'ไม่มีชื่อ' : names[rec.name.toLowerCase()] ? 'ชื่อซ้ำกับที่มีอยู่ (ข้าม)' : '';

        rec.kind = k === 'customers' ? 'customer' : 'supplier';
        rec.entity = /person|บุคคล/i.test(rec.entity || '') ? 'person' : 'company';
        if (rec.taxId) { rec.taxId = rec.taxId.replace(/[\s-]/g, ''); if (!err && !/^\d{13}$/.test(rec.taxId)) err = 'เลขผู้เสียภาษีไม่ใช่ 13 หลัก'; }
      } else {
        rec.kind = /service|บริการ/i.test(rec.kind || '') ? 'service' : 'goods';
        ['price','cost','openingQty','reorderPoint'].forEach(function(n) { if (rec[n] != null) rec[n] = impNum(rec[n]) || 0; });
      }
      if (rec.name && !err) names[rec.name.toLowerCase()] = 1;
      out.push({ ok: !err, err: err, label: rec.name || '-', sub: rec.taxId || rec.sku || rec.phone || '', coll: coll, rec: rec });
    });
    return out;
  }
  if (k === 'bank') {
    var bank = (byId('impBankAcc') || {}).value || '1120', inA = (byId('impInAcc') || {}).value || '4110', outA = (byId('impOutAcc') || {}).value || '5290';
    impState.rows.forEach(function(r) {
      var date = impDate(impVal(r, 'date')), amt = impNum(impVal(r, 'amount'));

function prAttendanceDeduction(line,ym,c) {
  var mode=c.mode || 'salary';
  if (!['salary','interval'].includes(mode) || (mode === 'interval' && (!Number.isInteger(c.minutes) || c.minutes<1 || !Number.isFinite(c.amount) || c.amount<0 || !['floor','ceil'].includes(c.rounding))) || !Number.isInteger(c.divisor) || c.divisor<1 || c.divisor>31) throw Error('กรุณาตั้งค่าหักมาสาย / ขาดงานก่อน');
  var records=(STORE.leaves || []).filter(function(l) { return l.empId===line.empId && l.status==='approved' && ['late','absence'].includes(l.leaveType) && l.startDate.slice(0,7)<=ym && l.endDate.slice(0,7)>=ym; });
  var late=0,days=0;
  records.forEach(function(l) {
    if (l.startDate.slice(0,7)!==ym || l.endDate.slice(0,7)!==ym) throw Error('รายการขาดงานคร่อมเดือน กรุณาแยกบันทึกตามเดือนก่อนนำเข้า');
    var error=prLeaveError(l); if (error) throw Error(error);
    if (l.leaveType==='late') {
      if (mode === 'salary') { var exact=prAmount(line,'base')*l.minutes/(30*8*60); late+=Math.ceil(exact-Number.EPSILON*Math.max(1,exact)*4); }
      else late+=(c.rounding==='ceil' ? Math.ceil(l.minutes/c.minutes) : Math.floor(l.minutes/c.minutes))*c.amount;
    }
    else days+=l.days;
  });
  return {late:round2(late),absence:round2(prAmount(line,'base')/c.divisor*days),days:days,ids:records.map(function(l) { return l._id; }),policy:Object.assign({},c,{mode:mode,hoursPerDay:8,lateDivisor:30}),period:ym};
}
