<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PSMacc</title></head><body>
<title>PSMacc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-page: #EEF3F9;
    --bg-sidebar: #D8E8FA;
    --bg-panel: #FFFFFF;
    --bg-hover: #E5EEF8;
    --bg-accent-soft: #DCEAFA;
    --accent: #2B6CB0;
    --accent-strong: #1B4C82;
    --danger: #B3402A;
    --danger-soft: #FBE7E2;
    --good: #23724F;
    --good-soft: #DDF1E6;
    --warn: #93600F;
    --warn-soft: #FBEFD6;
    --series-rev: #2B6CB0;
    --series-exp: #C97A1E;
    --text-primary: #16233A;
    --text-secondary: #4C5E76;
    --text-muted: #7A8DA6;
    --text-on-accent: #FFFFFF;
    --border: #DCE6F0;
    --border-strong: #C1D3E5;
    --sidebar-text: #16233A;
    --sidebar-text-dim: #5E7794;
    --radius: 10px;
    --ok-strong: #1F6B3A;
    --font-sans: 'IBM Plex Sans Thai', 'Inter', system-ui, sans-serif;
    --font-num: 'Inter', 'IBM Plex Sans Thai', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg-page: #0B1626; --bg-sidebar: #060E1B; --bg-panel: #111F33; --bg-hover: #16283F;
      --bg-accent-soft: #1B3350; --accent: #5FA8E0; --accent-strong: #8CC4EC; --danger: #E08469;
      --danger-soft: #3A1E1A; --good: #6CCB9C; --good-soft: #15352A; --warn: #E3B563; --warn-soft: #3A2E15;
      --series-rev: #4A94D0; --series-exp: #BA7E2E;
      --text-primary: #E7F0FA; --text-secondary: #A9C0D8; --text-muted: #7F97B2;
      --text-on-accent: #08131F; --border: #1E3350; --border-strong: #2A4562;
      --sidebar-text: #D9E6F7; --sidebar-text-dim: #6E86A0;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg-page: #0B1626; --bg-sidebar: #060E1B; --bg-panel: #111F33; --bg-hover: #16283F;
    --bg-accent-soft: #1B3350; --accent: #5FA8E0; --accent-strong: #8CC4EC; --danger: #E08469;
    --danger-soft: #3A1E1A; --good: #6CCB9C; --good-soft: #15352A; --warn: #E3B563; --warn-soft: #3A2E15;
    --series-rev: #4A94D0; --series-exp: #BA7E2E;
    --text-primary: #E7F0FA; --text-secondary: #A9C0D8; --text-muted: #7F97B2;
    --text-on-accent: #08131F; --border: #1E3350; --border-strong: #2A4562;
    --sidebar-text: #D9E6F7; --sidebar-text-dim: #6E86A0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-page); font-family: var(--font-sans); color: var(--text-primary); font-size: 14px; }
  button, input, select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: inherit; text-decoration: none; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .app { display: flex; min-height: 100%; }

  .sidebar {
    width: 84px; flex-shrink: 0; background: var(--bg-sidebar);
    border-right: 1px solid var(--border-strong);
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 0 12px; gap: 20px;
  }
  .side-item {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    cursor: pointer; color: var(--sidebar-text-dim); width: 100%; padding: 4px 0;
    background: none; border: none;
  }
  .side-item:hover { color: var(--sidebar-text); }
  .side-item.active { color: var(--sidebar-text); font-weight: 600; }
  .side-item span { font-size: 10.5px; text-align: center; line-height: 1.2; }
  .create-btn {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-on-accent); font-size: 22px; font-weight: 400;
  }
  .side-icon { width: 20px; height: 20px; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: 58px; flex-shrink: 0; display: flex; align-items: center; gap: 14px;
    padding: 0 20px; border-bottom: 1px solid var(--border); background: var(--bg-panel);
  }
  .company-pill { font-weight: 600; font-size: 15px; white-space: nowrap; }
  .search {
    flex: 1; max-width: 480px; display: flex; align-items: center; gap: 8px;
    background: var(--bg-hover); border: 1px solid var(--border); border-radius: 20px;
    padding: 0 14px; color: var(--text-muted);
  }
  .search input { flex: 1; border: none; background: none; padding: 8px 0; font-size: 13.5px; color: var(--text-primary); min-width: 0; }
  .search input:focus { outline: none; }
  .search:focus-within { border-color: var(--accent); }
  .topbar-icons { position: relative; }
  .topbar-icons { display: flex; align-items: center; gap: 14px; margin-left: auto; color: var(--text-secondary); }
  .mode-badge { font-size: 11.5px; padding: 3px 10px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--bg-accent-soft);
    color: var(--accent-strong); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
  }
  .body-area { flex: 1; padding: 28px 28px 40px; min-width: 0; }

  /* Home */
  .home-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 14px; margin-bottom: 26px; }
  .home-greeting { font-size: 30px; font-weight: 700; margin: 0; }
  .home-date { font-size: 13.5px; color: var(--text-secondary); margin-top: 4px; }
  .pill-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 28px; }
  .pill {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--border-strong); border-radius: 24px; padding: 8px 18px 8px 8px;
    background: var(--bg-panel); cursor: pointer; font-size: 14px; color: var(--text-primary);
  }
  .pill:hover { border-color: var(--accent); }
  .pill-dot { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; }
  .quick-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 32px; }
  .quick-row .ql { font-size: 14.5px; font-weight: 600; margin-right: 4px; }
  .chip-btn {
    border: 1px solid var(--border-strong); background: var(--bg-panel); border-radius: 20px;
    padding: 8px 16px; font-size: 13.5px; cursor: pointer; color: var(--text-primary);
  }
  .chip-btn:hover { border-color: var(--accent); color: var(--accent-strong); }
  .chip-btn.on { background: var(--bg-accent-soft); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
  .chip-link { font-size: 13.5px; color: var(--accent-strong); font-weight: 500; cursor: pointer; background: none; border: none; }
  .glance-title { font-size: 17px; font-weight: 600; margin: 0 0 14px; }
  .glance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .glance-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .glance-card.clickable { cursor: pointer; }
  .glance-card.clickable:hover { border-color: var(--accent); }
  .glance-label { font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; }
  .glance-value { font-size: 24px; font-weight: 700; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .glance-value.neg { color: var(--danger); }
  .glance-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .recent-section { margin-top: 34px; }

  /* Tables */
  .table-wrap { overflow-x: auto; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .data-table th { text-align: left; font-size: 12px; color: var(--text-muted); font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .data-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table .r { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .data-table tbody tr.row-link { cursor: pointer; }
  .data-table tbody tr.row-link:hover td { background: var(--bg-hover); }
  .data-table tr.group-row td { background: var(--bg-hover); font-weight: 600; font-size: 12.5px; color: var(--text-secondary); }
  .data-table tfoot td { font-weight: 600; border-top: 1px solid var(--border-strong); border-bottom: none; }
  .muted { color: var(--text-muted); }
  .small { font-size: 12px; }
  .empty-hint { font-size: 13px; color: var(--text-muted); padding: 18px 14px; }
  .docno { font-family: var(--font-num); font-size: 12.5px; color: var(--text-secondary); white-space: nowrap; }

  .status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 9px; border-radius: 11px; white-space: nowrap; font-weight: 500; }
  .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-partial { background: var(--bg-accent-soft); color: var(--accent-strong); }
  .st-paid { background: var(--good-soft); color: var(--good); }
  .st-unpaid { background: var(--warn-soft); color: var(--warn); }
  .st-overdue { background: var(--danger-soft); color: var(--danger); }
  .st-done { background: var(--bg-hover); color: var(--text-secondary); }

  /* Section view */
  .section-wrap { display: flex; margin: -28px -28px -40px; min-height: calc(100vh - 58px); }
  .subnav { width: 230px; flex-shrink: 0; background: var(--bg-panel); border-right: 1px solid var(--border); padding: 18px 10px; }
  .subnav-title { font-size: 12px; color: var(--text-muted); padding: 0 10px 10px; }
  .subnav-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 9px 10px; border-radius: 8px; background: none; border: none; cursor: pointer;
    font-size: 14px; color: var(--text-primary); margin-bottom: 2px;
  }
  .subnav-item .sn-dot { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; flex-shrink: 0; }
  .subnav-item .sn-chev { margin-left: auto; color: var(--text-muted); font-size: 11px; transition: transform .15s ease; }
  .subnav-item.expanded .sn-chev { transform: rotate(180deg); }
  .subnav-item:hover { background: var(--bg-hover); }
  .subnav-item.active { background: var(--bg-accent-soft); font-weight: 600; }
  .subnav-item.expanded { font-weight: 600; }
  .subnav-children { display: none; flex-direction: column; padding-left: 36px; margin-bottom: 4px; }
  .subnav-children.open { display: flex; }
  .subnav-child {
    width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; background: none; border: 1px solid transparent;
    cursor: pointer; font-size: 13.5px; color: var(--text-secondary); margin-bottom: 1px;
  }
  .subnav-child:hover { background: var(--bg-hover); }
  .subnav-child.active { background: var(--bg-panel); border-color: var(--accent); color: var(--accent-strong); font-weight: 600; }
  .mobile-nav { display: none; margin-bottom: 16px; }

  .section-content { flex: 1; min-width: 0; padding: 28px 32px 48px; }
  .section-title { font-size: 26px; font-weight: 700; margin: 0 0 6px; text-wrap: balance; }
  .section-sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 22px; max-width: 70ch; line-height: 1.55; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 16px; }
  .toolbar .field { min-width: 130px; }
  .toolbar .field.grow { flex: 1 1 200px; }
  .page-block { margin-top: 28px; }
  .page-block h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  .page-block .hint { font-size: 12.5px; color: var(--text-muted); margin: -4px 0 10px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .two-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
  .breadcrumb-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; font-size: 13px; color: var(--text-muted); }
  .empty-state { display: flex; align-items: center; gap: 40px; flex-wrap: wrap; margin-top: 30px; }
  .empty-state-text { flex: 1 1 260px; }
  .empty-state-text h3 { font-size: 20px; font-weight: 700; margin: 0 0 10px; }
  .empty-state-text p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin: 0 0 16px; }
  .empty-state-illo { flex: 1 1 260px; max-width: 340px; }
  .connector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .connector-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .connector-badge { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; color: #fff; }
  .connector-name { font-size: 15px; font-weight: 600; }
  .connector-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; flex: 1; }
  .connector-connect { background: var(--accent-strong); color: var(--bg-panel); border: none; border-radius: 8px; padding: 10px 14px; font-size: 13.5px; cursor: pointer; }
  .section-placeholder { font-size: 14px; color: var(--text-muted); padding: 40px 0; }
  .banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .banner.ok { background: var(--good-soft); color: var(--good); }
  .banner.bad { background: var(--danger-soft); color: var(--danger); }
  .banner.info { background: var(--bg-accent-soft); color: var(--accent-strong); }

  /* Chart */
  .chart-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 16px 8px; position: relative; }
  .chart-legend { display: flex; gap: 16px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 6px; flex-wrap: wrap; }
  .chart-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart-svg { width: 100%; height: auto; display: block; }
  .chart-svg text { fill: var(--text-muted); font-size: 11px; font-family: var(--font-num); }
  .chart-svg .grid { stroke: var(--border); stroke-width: 1; }
  .chart-svg .base { stroke: var(--border-strong); stroke-width: 1; }
  .chart-svg .hit { fill: transparent; cursor: default; }
  .chart-svg .hit:hover, .chart-svg .hit.on { fill: var(--bg-hover); opacity: .6; }
  .chart-tip { position: absolute; pointer-events: none; background: var(--bg-panel); border: 1px solid var(--border-strong); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(10,20,40,.12); display: none; min-width: 150px; z-index: 5; }
  .chart-tip .tt { font-weight: 600; margin-bottom: 4px; }
  .chart-tip .ln { display: flex; justify-content: space-between; gap: 12px; }
  .chart-tip .ln i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  details.table-view { margin-top: 8px; font-size: 13px; }
  details.table-view summary { cursor: pointer; color: var(--accent-strong); padding: 6px 0; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; background: rgba(10, 16, 28, 0.45); display: none; align-items: flex-start; justify-content: center; padding: 70px 16px 20px; z-index: 50; }
  .overlay.open { display: flex; }
  .menu-panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 26px; display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 24px; width: 100%; max-width: 780px; max-height: 85vh; overflow-y: auto; }
  .menu-col-title { font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin: 0 0 12px; }
  .menu-col button { display: block; width: 100%; text-align: left; font-size: 14px; color: var(--text-primary); padding: 6px 0; background: none; border: none; cursor: pointer; }
  .menu-col button:hover { color: var(--accent-strong); }
  .modal { background: var(--bg-panel); border-radius: 14px; width: 100%; max-width: 620px; max-height: 86vh; overflow-y: auto; border: 1px solid var(--border); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg-panel); z-index: 2; }
  .modal-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .modal-close { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 18px; line-height: 1; padding: 4px; }
  .modal-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 5px; }
  .field input, .field select, .items-table input, .items-table select {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border-strong);
    background: var(--bg-hover); color: var(--text-primary); font-size: 14px;
  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .items-wrap { overflow-x: auto; }
  .items-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 420px; }
  .items-table th { text-align: left; font-size: 11.5px; color: var(--text-muted); font-weight: 500; padding: 4px 6px; }
  .items-table td { padding: 4px 6px; }
  .items-table input, .items-table select { padding: 7px 8px; font-size: 13px; }
  .items-table .amt { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--text-secondary); }
  .item-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 15px; padding: 4px; }
  .add-row-btn { align-self: flex-start; background: none; border: 1px dashed var(--border-strong); color: var(--accent-strong); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; margin-top: 6px; }
  .sum-block { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
  .sum-line { display: flex; justify-content: space-between; color: var(--text-secondary); }
  .sum-line span:last-child { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .sum-line.big { font-size: 16px; font-weight: 700; color: var(--text-primary); }
  .sum-line.bal-bad { color: var(--danger); }
  .sum-line.bal-ok { color: var(--good); }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--border); flex-wrap: wrap; position: sticky; bottom: 0; background: var(--bg-panel); }
  .btn { padding: 9px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid var(--border-strong); background: var(--bg-hover); color: var(--text-primary); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--text-on-accent); }
  .btn-danger { color: var(--danger); border-color: var(--danger); background: none; }
  .btn-danger.arm { background: var(--danger); color: var(--bg-panel); }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .form-error { font-size: 12.5px; color: var(--danger); }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 18px; }
  .kv div span { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .toast { position: fixed; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--accent-strong); color: var(--bg-panel); padding: 10px 18px; border-radius: 20px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 60; }
  .toast.show { opacity: 1; }
  [hidden] { display: none !important; }

  /* Chart of accounts (list style) */
  .coa-head { margin-bottom: 18px; }
  .coa-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--accent-strong); font-size: 15px; cursor: pointer; padding: 4px 0; }
  .coa-actions { display: flex; gap: 10px; align-items: center; }
  .btn-outline { background: var(--bg-panel); border-color: var(--text-primary); font-weight: 600; }
  .btn-dark { background: var(--ok-strong); border-color: var(--ok-strong); color: #fff; font-weight: 600; }
  .split { display: inline-flex; position: relative; }
  .split > .btn-dark:first-child { border-radius: 8px 0 0 8px; }

var DOC_TYPES = {

  payment:        { label:'การรับชำระเงิน', group:'customer', template:'simple', partyLabel:'ลูกค้า', prefix:'PM', extra:[{key:'method',label:'วิธีชำระเงิน',type:'select',options:PAYMENT_METHODS},{key:'refDoc',label:'ชำระสำหรับเอกสารเลขที่',type:'text'}] },

  billingNote:    { label:'ใบแจ้งวางบิล', group:'customer', template:'itemized', billing:true, partyLabel:'ลูกค้า', prefix:'BN', extra:[{key:'dueDate',label:'นัดชำระวันที่',type:'date'}] },

  expense:        { label:'ค่าใช้จ่าย', group:'supplier', template:'simple', partyLabel:'ผู้รับเงิน', prefix:'EX', vat:true, wht:true, flow:'exp', sign:1, extra:[{key:'method',label:'วิธีชำระเงิน',type:'select',options:PAYMENT_METHODS}] },
  bill:           { label:'บิลซื้อ', group:'supplier', template:'itemized', partyLabel:'ผู้ขาย', prefix:'BL', vat:true, wht:true, flow:'exp', sign:1, status:true, extra:[{key:'dueDate',label:'วันครบกำหนดชำระ',type:'date'}] },
  checkPayment:   { label:'เช็คจ่าย', group:'supplier', template:'simple', partyLabel:'ผู้รับเงิน', prefix:'CQ', vat:true, wht:true, flow:'exp', sign:1, extra:[{key:'checkNo',label:'เลขที่เช็ค',type:'text'}] },
  purchaseOrder:  { label:'ใบสั่งซื้อ', group:'supplier', template:'itemized', partyLabel:'ผู้ขาย', prefix:'PO', vat:true, status:true, order:true, extra:[{key:'deliveryDate',label:'วันที่รับของ',type:'date'}] },
  vendorCredit:   { label:'เครดิตจากผู้ขาย', group:'supplier', template:'simple', partyLabel:'ผู้ขาย', prefix:'VC', vat:true, flow:'exp', sign:-1, extra:[{key:'refDoc',label:'อ้างอิงเอกสารเดิม',type:'text'}] },
  addSupplier:    { label:'เพิ่มซัพพลายเออร์', group:'supplier', action:'contact' },

  oneTimeActivity:{ label:'กิจกรรมครั้งเดียว', group:'team', template:'record', partyLabel:'รายละเอียดกิจกรรม', prefix:'AC', extra:[{key:'employee',label:'พนักงาน',type:'text',list:'dl_employees'},{key:'hours',label:'จำนวนชั่วโมง',type:'number'}] },
  weeklyTimesheet:{ label:'บันทึกงานรายสัปดาห์', group:'team', template:'record', partyLabel:'พนักงาน', partyList:'dl_employees', prefix:'TS', extra:[{key:'week',label:'สัปดาห์ที่',type:'text'},{key:'hours',label:'จำนวนชั่วโมง',type:'number'}] },

  project:        { label:'โปรเจกต์', group:'project', template:'record', partyLabel:'ชื่อโปรเจกต์', prefix:'PJ', status:true, proj:true, extra:[{key:'client',label:'ลูกค้า/เจ้าของโครงการ',type:'text',list:'dl_customers'},{key:'budget',label:'งบประมาณ (บาท)',type:'number'},{key:'endDate',label:'กำหนดเสร็จ',type:'date'},{key:'manager',label:'ผู้รับผิดชอบ',type:'text',list:'dl_employees'}] },

  journalEntry:   { label:'สมุดรายวันทั่วไป', group:'other', template:'journal', partyLabel:'คำอธิบายรายการ', prefix:'JV', extra:[] },
  bankDeposit:    { label:'ฝากเงินธนาคาร', group:'other', template:'simple', partyLabel:'บัญชีธนาคาร', prefix:'DP', extra:[{key:'source',label:'รับจาก',type:'text'}] },
  transfer:       { label:'โอนเงิน', group:'other', template:'simple', partyLabel:'จากบัญชี', prefix:'TR', extra:[{key:'toAccount',label:'ไปยังบัญชี',type:'text'}] },
  inventoryAdjust:{ label:'ปรับจำนวนสินค้าคงคลัง', group:'other', template:'record', partyLabel:'สินค้า', partyList:'dl_products', prefix:'IA', extra:[{key:'qtyChange',label:'จำนวนที่ปรับ (+ เพิ่ม / − ลด)',type:'number'},{key:'reason',label:'เหตุผล',type:'text'}] },
  addProduct:     { label:'เพิ่มสินค้า/บริการ', group:'other', action:'product' },
  addAccount:     { label:'เพิ่มบัญชีในผังบัญชี', group:'other', action:'account' }
};
// supplier's own invoice / tax-invoice reference on purchase documents
['expense','bill','checkPayment','vendorCredit','purchaseOrder'].forEach(function(t) {
  var x = DOC_TYPES[t]; if (!x) return;
  x.extra = [{ key:'supInvNo', label: t === 'purchaseOrder' ? 'เลขที่ใบเสนอราคาผู้ขาย' : 'เลขที่ใบกำกับภาษี / เลขที่บิลผู้ขาย', type:'text' }, { key:'supInvDate', label: t === 'purchaseOrder' ? 'วันที่ใบเสนอราคา' : 'วันที่ใบกำกับภาษี / บิล', type:'date' }].concat(x.extra || []);
});

var GROUP_ORDER = ['customer','supplier','team','project','other'];
var GROUP_LABEL = { customer:'ลูกค้า', supplier:'ซัพพลายเออร์', team:'ทีมงาน', project:'โครงการ', other:'อื่น ๆ' };

var ACCOUNT_TYPES = [
  { key:'asset', label:'สินทรัพย์', debitNormal:true },
  { key:'liability', label:'หนี้สิน', debitNormal:false },
  { key:'equity', label:'ส่วนของเจ้าของ', debitNormal:false },
  { key:'income', label:'รายได้', debitNormal:false },
  { key:'expense', label:'ค่าใช้จ่าย', debitNormal:true }
];
// Account type (ประเภทบัญชี) -> base class; BAL = balance sheet, P&L = income statement
var ACC_SUBTYPES = [
  ['bank','ธนาคาร','asset'],['ar','ลูกหนี้การค้า (A/R)','asset'],['curAsset','สินทรัพย์หมุนเวียน','asset'],['fixedAsset','สินทรัพย์ถาวร','asset'],
  ['ap','เจ้าหนี้การค้า (A/P)','liability'],['curLiab','หนี้สินหมุนเวียน','liability'],['ltLiab','หนี้สินไม่หมุนเวียน','liability'],
  ['equity','ส่วนของเจ้าของ','equity'],
  ['income','รายได้','income'],['otherIncome','รายได้อื่น','income'],
  ['cogs','ต้นทุนขาย','expense'],['expense','ค่าใช้จ่าย','expense'],['otherExpense','ค่าใช้จ่ายอื่น','expense']
];
var DEFAULT_SUBTYPE = { asset:'curAsset', liability:'curLiab', equity:'equity', income:'income', expense:'expense' };
function accSubtype(a) {
  if (a.accType && ACC_SUBTYPES.some(function(x) { return x[0] === a.accType; })) return a.accType;
  if (DEFAULT_SUBTYPE[a.type]) return DEFAULT_SUBTYPE[a.type];
  var t = String(a.accType || a.type || '');
  var th = ACC_SUBTYPES.find(function(x) { return x[1] === t; }); if (th) return th[0];
  if (/รายได้/.test(t)) return 'income'; if (/ต้นทุน/.test(t)) return 'cogs'; if (/ค่าใช้จ่าย/.test(t)) return 'expense';
  if (/หนี้สิน/.test(t)) return 'curLiab'; if (/ทุน|เจ้าของ/.test(t)) return 'equity'; if (/สินทรัพย์|ธนาคาร|เงินสด/.test(t)) return 'curAsset';
  return ({ '1':'curAsset','2':'curLiab','3':'equity','4':'income','5':'expense' })[String(a.code || '').charAt(0)] || 'expense';
}
function subtypeLabel(k) { var s = ACC_SUBTYPES.find(function(x) { return x[0] === k; }); return s ? s[1] : k; }
function subtypeBase(k) { var s = ACC_SUBTYPES.find(function(x) { return x[0] === k; }); return s ? s[2] : 'expense'; }
function isPL(a) { var t = subtypeBase(accSubtype(a)); return t === 'income' || t === 'expense'; }
var TAX_CODES = [['','—'],['vat7','VAT 7%'],['vat0','VAT 0%'],['exempt','ยกเว้น VAT']];
// [code, name, accType, detailType, taxCode]
var STANDARD_COA = [

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }

function fmtMoney(n, dec) { n = Number(n) || 0; var d = dec == null ? 2 : dec; return (n < 0 ? '−฿' : '฿') + Math.abs(n).toLocaleString('th-TH', { minimumFractionDigits:d, maximumFractionDigits:d }); }

function fmtDate(s) { if (!s) return '-'; var d = new Date(s + 'T00:00:00'); if (isNaN(d)) return esc(s); return d.toLocaleDateString('th-TH', { day:'numeric', month:'short', year:'2-digit' }); }

function docFlow(d) { var t = DOC_TYPES[d.type]; if (d.type === 'receipt' && d.extra && d.extra.invoiceId) return null; return t ? t.flow : null; }
function docSign(d) { var t = DOC_TYPES[d.type]; return t && t.sign ? t.sign : 1; }
function docStatus(d) {
  if (d.voided) return 'void';
  var t = DOC_TYPES[d.type];
  if (!t || !t.status) return 'done';
  if (d.status === 'paid') return 'paid';
  if (t.flow && d.payments && d.payments.length && docBal(d) <= 0.009) return 'paid';

  if (rec) buttons.push(confirmDeleteBtn(function(el) {

  }));
  buttons.push(CANCEL_BTN);
  buttons.push({ label:'บันทึก', cls:'btn-primary', onClick: function(el) { saveRecord(el, coll, rec); } });
  openModal({ title: (rec ? 'แก้ไข' : 'เพิ่ม') + meta.title, body: body, buttons: buttons });
}

function saveRecord(btn, coll, rec) {
  var meta = COLL_META[coll];
  var out = {};
  var err = null;
  meta.fields.forEach(function(f) {
    var el = byId('r_' + f.key);
    var v = el.value.trim();
    if (f.required && !v && !err) err = 'กรุณาระบุ' + f.label;
    out[f.key] = f.type === 'number' ? (v === '' ? null : Number(v)) : v;
  });
  if (!err && coll === 'contacts' && out.taxId && !/^\d{13}$/.test(out.taxId.replace(/[\s-]/g, ''))) err = 'เลขประจำตัวผู้เสียภาษีต้องเป็นตัวเลข 13 หลัก';
  if (coll === 'contacts' && out.taxId) out.taxId = out.taxId.replace(/[\s-]/g, '');
  if (coll === 'accounts') out.type = subtypeBase(out.accType);
  if (!err && coll === 'accounts') {
    var dup = STORE.accounts.find(function(a) { return a.code === out.code && (!rec || a._id !== rec._id); });
    if (dup) err = 'รหัสบัญชี ' + out.code + ' ถูกใช้แล้วกับ "' + dup.name + '"';
  }
  var errEl = byId('formError');
  if (err) { errEl.textContent = err; errEl.hidden = false; return; }
  runSave(btn, async function() {
    if (rec) await setRec(coll, rec._id, Object.assign({}, strip(rec), out, { updatedAt: Date.now() }));
    else await addRec(coll, Object.assign(out, { createdAt: Date.now() }));
    showToast(meta.title + ' บันทึกแล้ว');
    closeModal();
  });
}

function nextDocNo(type, date) {
  var def = DOC_TYPES[type];
  var pre = (def.prefix || 'DOC') + '-' + (date || todayStr()).slice(0,7).replace('-','') + '-';
  var used = {};
  STORE.documents.forEach(function(d) { if (d.docNo && d.docNo.indexOf(pre) === 0) { var n = parseInt(d.docNo.slice(pre.length), 10); if (n > 0) used[n] = 1; } });
  var n = 1; while (used[n]) n++;   // reuse the first free number (deleted docs); voided docs keep theirs

}

function computeTotals() {
  var def = DOC_TYPES[form.type];
  var base = 0;
  if (def.template === 'itemized') base = form.items.reduce(function(s, r) { return s + (Number(r.qty) || 0) * (Number(r.price) || 0); }, 0);
  else if (def.template === 'simple') base = Number((byId('f_amount') || {}).value) || 0;
  var mode = def.vat ? byId('f_vat').value : 'none';
  var whtRate = def.wht ? Number(byId('f_wht').value) || 0 : 0;
  var subtotal = base, vat = 0;
  if (mode === 'exclusive') vat = base * VAT_RATE;
  else if (mode === 'inclusive') { subtotal = base / (1 + VAT_RATE); vat = base - subtotal; }
  subtotal = round2(subtotal); vat = round2(vat);
  var total = round2(subtotal + vat);
  var wht = round2(subtotal * whtRate / 100);
  return { base: round2(base), vatMode: mode, whtRate: whtRate, subtotal: subtotal, vat: vat, total: total, wht: wht, net: round2(total - wht) };
}

function updateSummary() {
  var el = byId('sumBlock');
  if (!el || !form) return;
  var def = DOC_TYPES[form.type];
  if (def.template === 'journal') {
    var dr = round2(form.journal.reduce(function(s, r) { return s + (Number(r.debit) || 0); }, 0));
    var cr = round2(form.journal.reduce(function(s, r) { return s + (Number(r.credit) || 0); }, 0));
    var ok = dr === cr && dr > 0;
    el.innerHTML = '<div class="sum-line"><span>รวมเดบิต</span><span>' + fmtMoney(dr) + '</span></div>' +
      '<div class="sum-line"><span>รวมเครดิต</span><span>' + fmtMoney(cr) + '</span></div>' +
      '<div class="sum-line ' + (ok ? 'bal-ok' : 'bal-bad') + '"><span>' + (ok ? '✓ สมดุล' : 'ยังไม่สมดุล ต่างกัน') + '</span><span>' + (ok ? '' : fmtMoney(Math.abs(dr - cr))) + '</span></div>';
    return;
  }
  var t = computeTotals();
  var h = '';
  if (def.vat && t.vatMode !== 'none') {
    h += '<div class="sum-line"><span>มูลค่าก่อนภาษี</span><span>' + fmtMoney(t.subtotal) + '</span></div>';
    h += '<div class="sum-line"><span>ภาษีมูลค่าเพิ่ม 7%</span><span>' + fmtMoney(t.vat) + '</span></div>';
  }
  h += '<div class="sum-line big"><span>รวมทั้งสิ้น</span><span>' + fmtMoney(t.total) + '</span></div>';
  if (t.wht) {
    h += '<div class="sum-line"><span>หัก ณ ที่จ่าย ' + t.whtRate + '% (จากมูลค่าก่อน VAT)</span><span>−' + fmtMoney(t.wht) + '</span></div>';
    h += '<div class="sum-line big"><span>' + (def.group === 'customer' ? 'ยอดรับสุทธิ' : 'ยอดจ่ายสุทธิ') + '</span><span>' + fmtMoney(t.net) + '</span></div>';
  }
  el.innerHTML = h;
}

function plTotals(docs) {
  var rev = 0, exp = 0;
  docs.forEach(function(d) { postingsOf(d).forEach(function(l) { var b = accBaseOf(l.code); if (b === 'income') rev += l.cr - l.dr; else if (b === 'expense') exp += l.dr - l.cr; }); });
  return { rev: round2(rev), exp: round2(exp), profit: round2(rev - exp) };

function periodRange(p) {

function agingBuckets(list) {
  var b = [{ label:'ยังไม่ครบกำหนด', n:0, amt:0 }, { label:'1–30 วัน', n:0, amt:0 }, { label:'31–60 วัน', n:0, amt:0 }, { label:'61–90 วัน', n:0, amt:0 }, { label:'เกิน 90 วัน', n:0, amt:0 }];
  var t = todayStr();
  list.forEach(function(d) {
    var due = (d.extra && d.extra.dueDate) || d.date;
    var late = daysBetween(due, t);
    var i = late <= 0 ? 0 : late <= 30 ? 1 : late <= 60 ? 2 : late <= 90 ? 3 : 4;
    b[i].n++; b[i].amt += docBal(d);
  });
  return b;
}

function accountBalances() {
  var bal = {};
  allLines().forEach(function(l) { var b = bal[l.code] = bal[l.code] || { dr:0, cr:0 }; b.dr += l.dr; b.cr += l.cr; });
  return bal;
}

function productStock(p) {
  var q = Number(p.openingQty) || 0;
  STORE.documents.forEach(function(d) {
    if (d.type === 'inventoryAdjust' && d.party === p.name) q += Number(d.extra && d.extra.qtyChange) || 0;
    if ((d.type === 'invoice' || d.type === 'bill') && d.items) {
      d.items.forEach(function(r) { if (r.name === p.name) q += (d.type === 'bill' ? 1 : -1) * (Number(r.qty) || 0); });
    }
  });
  return q;
}

        if (wrap.classList.contains('open')) { setExpanded(item.key, false); return; }
        go(item.key);

function go(key, child) {

  byId('sidebarFeedBtn').classList.toggle('active', key === 'alldocs');
  var navItem = SUBNAV_ITEMS.find(function(i) { return i.key === key; });
  if (navItem && navItem.children && !child && key !== 'accounting') child = navItem.children[0].key;
  route = { key: key, child: child || null };
  document.querySelectorAll('.subnav-item').forEach(function(b) { b.classList.toggle('active', b.dataset.key === key && !child); });
  document.querySelectorAll('.subnav-child').forEach(function(b) { b.classList.toggle('active', !!child && b.dataset.childKey === (child === 'view' ? 'standard' : child)); });
  if (navItem && navItem.children) setExpanded(key, true);
  byId('mobileNav').value = child ? key + ':' + child : key;
  renderPage();
  window.scrollTo(0, 0);
}
function setExpanded(key, open) {
  var w = byId('children-' + key), b = document.querySelector('.subnav-item[data-key="' + key + '"]');

function matchQ(d, q) {

function docListData(k) {

/* ---- Tax overview (VAT returns) ---- */
pageState.taxTab = 'returns'; pageState.taxFilter = '';
function vatSummary(ym) {
  var inMonth = taxDocs().filter(function(d) { return (d.date || '').slice(0,7) === ym && d.vat; });
  var out = round2(inMonth.filter(function(d) { return docFlow(d) === 'rev'; }).reduce(function(s, d) { return s + d.vat * docSign(d); }, 0));
  var inp = round2(inMonth.filter(function(d) { return docFlow(d) === 'exp'; }).reduce(function(s, d) { return s + d.vat * docSign(d); }, 0));
  var ret = taxReturn(ym);
  var adj = round2((ret && ret.adjustments || []).reduce(function(s, a) { return s + (Number(a.amount) || 0); }, 0));
  var paid = round2((ret && ret.payments || []).reduce(function(s, a) { return s + (Number(a.amount) || 0); }, 0));
  var due = round2(out - inp + adj);
  return { ym: ym, out: out, inp: inp, adj: adj, due: due, paid: paid, bal: round2(Math.max(due, 0) - paid), ret: ret, n: inMonth.length };
}
function taxReturn(ym) { return STORE.taxReturns.find(function(r) { return r.period === ym; }); }
function monthEnd(ym) { var d = new Date(ym + '-01T00:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0); return ym + '-' + String(d.getDate()).padStart(2,'0'); }
function addMonths(ym, n) { var d = new Date(ym + '-01T00:00:00'); d.setMonth(d.getMonth() + n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function taxPeriods() {
  var cur = todayStr().slice(0,7), first = cur;
  STORE.documents.forEach(function(d) { if (d.vat && d.date && d.date.slice(0,7) < first) first = d.date.slice(0,7); });
  STORE.taxReturns.forEach(function(r) { if (r.period < first) first = r.period; });
  var out = [];
  for (var m = first; m <= cur && out.length < 60; m = addMonths(m, 1)) out.push(m);
  return out;
}
function periodStatus(v) {
  var cur = todayStr().slice(0,7);
  if (v.ret && v.ret.filedDate) return v.bal > 0 ? 'filed' : 'done';
  if (v.ym === cur) return 'open';
  return 'pending';
}
var TAX_ST = { open:['ยังไม่ครบรอบ','st-done'], pending:['คงค้าง','st-unpaid'], filed:['ยื่นแล้ว รอชำระ','st-unpaid'], done:['ยื่นและชำระแล้ว','st-paid'] };
function nextPeriod() {
  var ps = taxPeriods();
  for (var i = 0; i < ps.length; i++) { var v = vatSummary(ps[i]); if (!(v.ret && v.ret.filedDate) && ps[i] < todayStr().slice(0,7)) return ps[i]; }
  return ps[ps.length - 1];
}
async function saveReturn(ym, patch) {
  var cur = taxReturn(ym);
  var rec = Object.assign({ period: ym, adjustments: [], payments: [] }, cur ? strip(cur) : {}, patch, { updatedAt: Date.now() });
  if (db) { await db.doc(cname('taxReturns') + '/vat-' + ym).set(rec); return; }
  STORE.taxReturns = STORE.taxReturns.filter(function(r) { return r.period !== ym; }).concat([Object.assign(rec, { _id: 'vat-' + ym })]);
  sortLocal('taxReturns'); onData();
}

function niceMax(v) {
  if (v <= 0) return 1000;
  var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function shortMoney(v) {
  if (v >= 1e6) return (v / 1e6).toLocaleString('th-TH', { maximumFractionDigits:1 }) + 'M';
  if (v >= 1e3) return (v / 1e3).toLocaleString('th-TH', { maximumFractionDigits:1 }) + 'K';
  return String(Math.round(v));
}
var CHART_DATA = null;
function barChart(months, series) {
  CHART_DATA = { months: months, series: series };
  var W = 720, H = 250, L = 48, R = 8, T = 12, B = 30;
  var max = niceMax(Math.max.apply(null, series.map(function(s) { return Math.max(s.rev, s.exp, 0); })));
  var pw = W - L - R, ph = H - T - B, slot = pw / months.length, bw = Math.min(16, (slot - 12) / 2);
  var y = function(v) { return T + ph - (Math.max(v, 0) / max) * ph; };
  var svg = '<svg class="chart-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="กราฟรายได้และค่าใช้จ่ายรายเดือน">';
  for (var i = 0; i <= 4; i++) {
    var v = max * i / 4, yy = y(v);
    svg += '<line class="' + (i ? 'grid' : 'base') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/>';
    svg += '<text x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + shortMoney(v) + '</text>';
  }
  function bar(x, v, color) {
    if (v <= 0) return '';
    var top = y(v), base = y(0), hgt = base - top, r = Math.min(4, hgt, bw / 2);
    return '<path fill="' + color + '" d="M' + x + ',' + base + 'V' + (top + r) + 'Q' + x + ',' + top + ' ' + (x + r) + ',' + top + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + top + ' ' + (x + bw) + ',' + (top + r) + 'V' + base + 'Z"/>';
  }
  months.forEach(function(m, i) {
    var cx = L + slot * i + slot / 2;
    svg += '<rect class="hit" data-i="' + i + '" x="' + (L + slot * i + 1) + '" y="' + T + '" width="' + (slot - 2) + '" height="' + ph + '" rx="4"/>';
    svg += bar(cx - bw - 1, series[i].rev, 'var(--series-rev)');
    svg += bar(cx + 1, series[i].exp, 'var(--series-exp)');
    svg += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + monthLabel(m) + '</text>';
  });
  svg += '</svg>';
  var table = '<details class="table-view"><summary>ดูเป็นตาราง</summary><div class="items-wrap"><table class="data-table"><thead><tr><th>เดือน</th><th class="r">รายได้</th><th class="r">ค่าใช้จ่าย</th><th class="r">กำไร</th></tr></thead><tbody>' +
    months.map(function(m, i) { return '<tr><td>' + monthLabel(m, true) + '</td><td class="r">' + fmtMoney(series[i].rev) + '</td><td class="r">' + fmtMoney(series[i].exp) + '</td><td class="r">' + fmtMoney(series[i].profit) + '</td></tr>'; }).join('') +
    '</tbody></table></div></details>';
  return '<div class="chart-card" id="chartCard"><div class="chart-legend"><span><i style="background:var(--series-rev)"></i>รายได้</span><span><i style="background:var(--series-exp)"></i>ค่าใช้จ่าย</span></div>' + svg +
    '<div class="chart-tip" id="chartTip"></div>' + table + '</div>';
}
function bindChart() {
  var card = byId('chartCard'), tip = byId('chartTip');
  if (!card) return;
  card.querySelectorAll('.hit').forEach(function(h) {
    function show() {
      var i = Number(h.dataset.i), s = CHART_DATA.series[i];
      tip.innerHTML = '<div class="tt">' + monthLabel(CHART_DATA.months[i], true) + '</div>' +
        '<div class="ln"><span><i style="background:var(--series-rev)"></i>รายได้</span><span class="num">' + fmtMoney(s.rev, 0) + '</span></div>' +
        '<div class="ln"><span><i style="background:var(--series-exp)"></i>ค่าใช้จ่าย</span><span class="num">' + fmtMoney(s.exp, 0) + '</span></div>' +
        '<div class="ln" style="margin-top:3px;font-weight:600"><span>กำไร</span><span class="num">' + fmtMoney(s.profit, 0) + '</span></div>';
      tip.style.display = 'block';
      var cr = card.getBoundingClientRect(), hr = h.getBoundingClientRect();
      var left = hr.left - cr.left + hr.width / 2 - tip.offsetWidth / 2;
      tip.style.left = Math.max(8, Math.min(left, cr.width - tip.offsetWidth - 8)) + 'px';
      tip.style.top = (hr.top - cr.top + 4) + 'px';
    }
    h.addEventListener('mouseenter', show);
    h.addEventListener('click', show);
    h.addEventListener('mouseleave', function() { tip.style.display = 'none'; });
  });
}
